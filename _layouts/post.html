---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
<div>
  <span class="post-date">{{ page.date | date: "%b %-d, %Y" }}</span> 
  <span style="color: #ccc;">|</span> 
  <span class="read-time"> {% assign words = content | strip_html | number_of_words %}
  {% assign read_time = words | divided_by: 180 | at_least: 1 %}
  {{ read_time }} min read</span>
  </div>
<hr>
  
  {{ content }}
</div>
<div class="tags">
{% for tag in page.tags %} <div class='tag'><a href='/tag/#{{tag}}'>{{tag}}</a></div> {% endfor %}
</div>
<hr>
